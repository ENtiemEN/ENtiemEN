name: Profile languages
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/languages.yml'
      - 'scripts/languages.py'
      - 'scripts/art/**'

permissions:
  contents: write

concurrency:
  group: profile-language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Measure languages and draw the cards
        run: python3 scripts/languages.py
        env:
          LANG_STATS_TOKEN: ${{ secrets.LANG_STATS_TOKEN }}
      - name: Publish aggregate statistics
        run: |
          git add -- README.md assets/languages.svg assets/languages-mobile.svg data/languages.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update language statistics'
          git push origin HEAD:main
